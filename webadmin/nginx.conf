# docker 内置 DNS resolver · 让 upstream 延迟到运行时解析,
# nginx 启动时不依赖 admin-api/api 已存在(配 lazy upstream 通过 var pass)
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # webadmin 是 SPA · 所有未命中 fall back 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # health check(独立可用,无需 upstream)
    location = /health.txt {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 反代 /admin/* 到 unmei-admin-api · 同源,无 CORS
    location /admin/ {
        set $admin_upstream "http://unmei-admin-api:6029";
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 反代 /v1/* 到 unmei-api(客户端 BFF · 给前端测试 / 演示用)
    location /v1/ {
        set $api_upstream "http://unmei-api:6028";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

name: slice

# 竖切 —— 一条链从头走到尾:匿名登录 → 扫御守入住 → 问签 → 进屋。
#
# 工序单第 11 步那条门禁写的是「一位真实用户从扫码走到问签」,要真机录屏。
# 真机进不了 CI,但这条链上【除了扫码那一跳】的每一环都能在这里跑完:
# 真的 Postgres、真的 unmei-api、真的匿名登录、真的入住、真的一签。
#
# 单独一条 workflow 而不是塞进 mini:它要 Rust 工具链 + 建后端 + 起库,
# 比别的门禁慢一个量级。混进去的话,改一行 wxss 也要等它。
#
# 库、迁移、种子、cargo 缓存这一套建起来之后,后台控制台的冒烟也搭在这里跑
# (末尾那几步)—— 单开一条 workflow 要把同样的一套再来一遍。
#
# 它红的含义也跟别的不同:别的红是「某处坏了」,这里红是
# 「这条链断了」—— 而这条链断了,产品就没有可以交付的核心动线。

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'scripts/admin-smoke.py'
      - 'scripts/check-idem-required.sh'
      - 'scripts/check-auth-guards.py'
      - 'scripts/verify-semantics.sh'
      - 'scripts/check-cross-user.py'
      - 'scripts/check-ghost-id.py'
      - 'webadmin/**'
      - 'scripts/webadmin-verify.mjs'
      - 'scripts/webadmin-verify.sh'
      - 'scripts/browser-smoke.mjs'
      - 'mini/**'
      - 'web/**'
      - 'rooms/host/**'
      - 'rooms/src/engine/**'
      - '.github/workflows/slice.yml'
      # 这条要建后端,是最慢的一条。改一份文档不该把它拖起来 ——
      # 它跑一次十几分钟,而没人会为了 README 等那么久,
      # 等久了就会开始忽略它,那才是真代价。
      - '!**/*.md'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/admin-smoke.py'
      - 'scripts/check-idem-required.sh'
      - 'scripts/check-auth-guards.py'
      - 'scripts/verify-semantics.sh'
      - 'scripts/check-cross-user.py'
      - 'scripts/check-ghost-id.py'
      - 'webadmin/**'
      - 'scripts/webadmin-verify.mjs'
      - 'scripts/webadmin-verify.sh'
      - 'scripts/browser-smoke.mjs'
      - 'mini/**'
      - 'web/**'
      - 'rooms/host/**'
      - 'rooms/src/engine/**'
      - '.github/workflows/slice.yml'
      # 这条要建后端,是最慢的一条。改一份文档不该把它拖起来 ——
      # 它跑一次十几分钟,而没人会为了 README 等那么久,
      # 等久了就会开始忽略它,那才是真代价。
      - '!**/*.md'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

# 同一分支上被后续推送顶掉的 run 没有必要跑完 —— 只有最新那个 commit 的结论有意义。
# 不换任何覆盖，纯粹少烧。（2026-08-23 账户 Actions 因支出上限停摆时加的。）
concurrency:
  group: slice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: unmei
          POSTGRES_USER: unmei
          POSTGRES_PASSWORD: unmei_dev_pwd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U unmei -d unmei"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://unmei:unmei_dev_pwd@localhost:5432/unmei
      # 验证脚本的夹具靠它连库发御守凭据(本机走 docker exec,这里走 psql)
      PSQL_URL: postgres://unmei:unmei_dev_pwd@localhost:5432/unmei
      UNMEI_API_BIND: 127.0.0.1:6028
      UNMEI_CACHE_DIR: /tmp/unmei-cache
      # mingli 在另一个仓库,这里没有。取不到盘时问签【如实落空盘】而不是假装算过,
      # 所以这条链照样走得完 —— 这正是那个设计的用处。
      MINGLI_API_BASE: http://127.0.0.1:6027

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # migrations 里用到 citext / pgcrypto / pg_trgm
      - name: pg extensions
        run: psql "$DATABASE_URL" -f infra/postgres/init.sql

      # 编译单独一步。跟启动混在一起(cargo run &)的话,健康检查那 240 秒
      # 是在等【编译 + 启动】,冷缓存下 Rust 编译本身就要好几分钟 ——
      # 超时报出来的是「后端没起来」,而真相是「还没编完」,
      # 那种误导比直接失败更费时间。
      - name: 建后端
        run: cd backend && cargo build -p unmei-api

      - name: 起后端（migrations 与 seed 由它自己跑）
        run: |
          cd backend
          ./target/debug/unmei-api > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for _ in $(seq 1 120); do
            curl -sf http://127.0.0.1:6028/v1/health >/dev/null && break
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:6028/v1/health >/dev/null; then
            echo "::error::后端没起来"
            tail -40 /tmp/api.log
            exit 1
          fi
          curl -s http://127.0.0.1:6028/v1/health

      - name: 引擎产物
        run: |
          cd rooms && bun install --frozen-lockfile
          cd ../mini && npm install --no-audit --no-fund
          npm run build:engine

      # runner 镜像里本来就有 Google Chrome。`playwright install` 会走 apt，
      # 而 apt 是这两次挂起的位置（2026-08-18 卡了 37 分钟一次、又一次）。
      # 有就直接用：Playwright 的 channel: 'chrome' 找的就是系统上这一个
      # —— 本机从来没装过，一直是这么跑的。
      - name: install chrome（runner 上有就不装）
        run: google-chrome --version || bunx playwright install --with-deps chrome

      # 这里跑的是【与本机同一条命令】。CI 与本机敲不一样的东西时,
      # 一边绿一边红最难查 —— 所以两边都走 web/run-verify.sh。
      - name: 竖切 · 匿名登录 → 扫御守入住 → 问签 → 进屋
        run: bash web/run-verify.sh --api=http://127.0.0.1:6028

      # 一条忘了加 AuthedUser 的路由，是一扇通向别人本命、别人问签记录的开着的门，
      # 而它一点异样都没有：带着 token 测，一切正常。不带 token 打是安全的。
      - name: 要登录的接口挡不挡得住
        run: python3 scripts/check-auth-guards.py http://127.0.0.1:6028

      # 登录挡住的是「谁都能进」，挡不住「进来之后串门」。
      # 越权带着自己的 token 测永远看不出来 —— 每条接口对自己人都工作正常。
      - name: 甲的东西乙碰不碰得到
        run: python3 scripts/check-cross-user.py http://127.0.0.1:6028

      # D6 拍板「客户端带幂等键」，服务端实现了 —— 但它原先不带键就放行，
      # 而【没有任何客户端在发这个头】。今天还没有客户端调这两条，
      # 所以这道门禁守的是将来那个人：忘了带键当场 400，不是悄悄多扣一次。
      - name: 钱的接口要不要幂等键
        run: bash scripts/check-idem-required.sh http://127.0.0.1:6028

      # ── 后台控制台 ────────────────────────────────────────────
      # 顺带在这里跑:库已经建好、种子已经落好、cargo 缓存也热着,
      # 单开一条 workflow 要把这一套再来一遍,十分钟换一分钟的事。
      #
      # 它验的是【58 条路由答不答得出话】。此前 CI 只知道它编得过,
      # 而一条查询写错在编译期看不出来 —— 它表现成运行期 500,
      # 运营那边看到的是一张空表格。
      - name: 建后台 API
        run: cd backend && cargo build -p unmei-admin-api

      - name: 起后台 API
        run: |
          cd backend
          UNMEI_ADMIN_API_BIND=127.0.0.1:6029 ./target/debug/unmei-admin-api > /tmp/admin.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:6029/admin/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:6029/admin/health || { echo "::error::后台 API 没起来"; tail -40 /tmp/admin.log; exit 1; }

      - name: 后台冒烟 · 每条路由真打一遍
        run: python3 scripts/admin-smoke.py

      # id 打错一个字符回 200 ok:true，页面写着「已保存」而库里一行没动。
      # 2026-08-19 全量探了后台 17 条带 :参数 的写路由，3 条这样 ——
      # 正是仅有的三条绕过 unmei-app 直接在路由里写 SQL 的。
      # 用户侧那 6 条同天也探了，全部正确 404；两边都在这一支里守着。
      - name: 幽灵 id 的写操作不许说成功
        run: python3 scripts/check-ghost-id.py http://127.0.0.1:6029 http://127.0.0.1:6028

      # 边界那一半:该拒的拒没拒、该 404 的 404 没有、该落库的字段落没落。
      # 它要两个 API 都起着 —— 到这一步正好都在。
      # 2026-08-18 之前这一支【只在本机门禁里】，CI 查得比本机少，
      # 而少的正是「语义」这一层（当时它还因为幂等键那条要求全线红过）。
      - name: 语义 · 边界那一半
        run: bash scripts/verify-semantics.sh

      # 两半分别验过还不够:构建说前端编得过,冒烟说接口答得出话,
      # 而【接在一起】没人验过。那条缝是真的 —— Users 那一页从初始提交起
      # 就挂在侧边栏上,而它要的 /admin/users 后端根本没有,前端拿到 404
      # 就当没数据,于是页面永远空着,两边的门禁都不会红。
      - name: 后台控制台 · 逐页走一遍
        run: bash scripts/webadmin-verify.sh

      - name: 后端日志（失败时看这里）
        if: failure()
        run: tail -60 /tmp/api.log

      - name: 后台日志（失败时看这里）
        if: failure()
        run: tail -60 /tmp/admin.log

name: backend

on:
  push:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

env:
  CARGO_TERM_COLOR: always
  # 全仓统一走运行期 sqlx::query() —— 编译不需要连库，也不需要 .sqlx 缓存。
  # 若有人重新引入 sqlx::query! 宏，这一步会直接失败，这就是护栏本身。
  SQLX_OFFLINE: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # 用例层的集成测试要一个真库。用 mock 测这一层等于测 mock ——
    # 它的价值几乎全在 SQL 与事务边界上(状态机拦没拦住、outbox 有没有跟
    # 业务写入同批提交、影响行数为 0 时报不报 404)。
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: unmei
          POSTGRES_USER: unmei
          POSTGRES_PASSWORD: unmei_dev_pwd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U unmei -d unmei"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://unmei:unmei_dev_pwd@localhost:5432/unmei

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # migrations 里用到 citext / pgcrypto / pg_trgm,跟 infra/postgres/init.sql 一致
      - name: pg extensions
        run: psql "$TEST_DATABASE_URL" -f ../infra/postgres/init.sql

      - name: cargo check
        run: cargo check --workspace --all-targets

      # 测试数落进文件,下一步据此断言它们真的跑了。
      # 没有这道断言的话,集成测试哪天悄悄退化成「无 DB 静默跳过」也看不出来 ——
      # 本地就踩过一次:15 passed,其实一个没跑。
      - name: cargo test
        run: cargo test --workspace 2>&1 | tee /tmp/test.log

      - name: assert the db-backed tests actually ran
        run: |
          PASSED=$(grep -oE '^test result: ok\. [0-9]+ passed' /tmp/test.log \
                   | grep -oE '[0-9]+' | paste -sd+ - | bc)
          echo "通过的测试总数: ${PASSED:-0}"
          # 纯逻辑单测(risk DSL + 状态机 + money + region + carrier)约 25 条;
          # 加上三组用例层集成测试后是 70 条。低于 60 说明集成测试没跑起来。
          if [ "${PASSED:-0}" -lt 60 ]; then
            echo "::error::只有 ${PASSED:-0} 条测试通过，用例层集成测试没跑（多半是 TEST_DATABASE_URL 没生效）。"
            exit 1
          fi
          echo "✓ 用例层集成测试确实跑了"

      # ── 依赖方向护栏 · clean arch ────────────────────────────────
      # unmei-domain 是最内层:不许依赖任何数据库 / HTTP / Web 框架。
      # 依赖方向是 api → app → domain ← 持久化实现。
      #
      # 判据用依赖树而不是 grep 源码 —— 注释里提到 sqlx 不算违规,
      # 而通过某个中间 crate 间接引入却是真违规,只有依赖树看得见。
      # P0 时 domain/src 里有 215 处基础设施引用,P1 后 24,P2 归零。
      - name: domain purity gate
        run: |
          echo "== unmei-domain 依赖树 =="
          cargo tree -p unmei-domain
          if cargo tree -p unmei-domain | grep -qE '(sqlx|axum|reqwest|hyper|tower)'; then
            echo "::error::unmei-domain 依赖了基础设施库。domain 是最内层，依赖方向反了。"
            echo "把持久化 / 传输相关的东西放到 unmei-app 或适配器 crate 里。"
            exit 1
          fi
          echo "✓ domain 纯净"

name: backend

on:
  push:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

env:
  CARGO_TERM_COLOR: always
  # 全仓统一走运行期 sqlx::query() —— 编译不需要连库，也不需要 .sqlx 缓存。
  # 若有人重新引入 sqlx::query! 宏，这一步会直接失败，这就是护栏本身。
  SQLX_OFFLINE: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      # ── 依赖方向护栏 · clean arch ────────────────────────────────
      # unmei-domain 是最内层:不许依赖 sqlx / axum / http / reqwest。
      # P1 删掉 services_impl 后从 215 降到 24;剩下的是聚合根上的
      # FromRow / sqlx::Type 派生、outbox.rs 的 SQL、adapters 里的 http::HeaderMap,
      # 全部由 P2 收敛。到 0 之前这一步只报数,不当失败门禁。
      - name: domain purity report
        continue-on-error: true
        run: |
          COUNT=$(grep -rn 'sqlx\|axum\|http::\|reqwest' unmei-domain/src | wc -l | tr -d ' ')
          echo "== unmei-domain 中的基础设施引用: $COUNT（P1 后基线 24，P2 目标 0）=="
          if [ "$COUNT" -gt 24 ]; then
            echo "::warning::domain 的基础设施引用比 P1 基线(24)还多，方向反了"
          fi

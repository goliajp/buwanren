name: infra

# 部署用的那几份配置。它们平时不参与任何构建，**只有部署那天才会告诉你对不对** ——
# 而那时候人正忙着别的事。验一遍各只要几秒。
#
# nginx.conf 是 webadmin 在生产里的门面：SPA 回退、把 `/admin/` 反代到后台 API、
# 把 `/v1/` 反代到客户端 API。它写错的后果是控制台打得开、但一个接口都调不通。

on:
  push:
    branches: [main, develop]
    paths:
      - 'docker-compose.yml'
      - 'webadmin/nginx.conf'
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'webadmin/nginx.conf'
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

# 同一分支上被后续推送顶掉的 run 没有必要跑完 —— 只有最新那个 commit 的结论有意义。
# 不换任何覆盖，纯粹少烧。（2026-08-23 账户 Actions 因支出上限停摆时加的。）
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # compose 里一个缩进错、一个引用不存在的服务，`up` 之前都看不出来
      - name: docker-compose 合不合法
        run: docker compose config --quiet

      # nginx -t 用官方镜像跑，跟生产里那份是同一个解析器
      - name: nginx.conf 合不合法
        run: |
          docker run --rm -v "$PWD/webadmin/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      # 反代的目标要跟 compose 里的服务名对得上 —— 写成别的名字时
      # nginx 启动照样成功（upstream 是延迟解析的），到运行时才 502
      - name: 反代目标是 compose 里真有的服务吗
        run: |
          for svc in $(grep -oE 'http://[a-z-]+:[0-9]+' webadmin/nginx.conf | sed 's|http://||;s|:.*||' | sort -u); do
            if docker compose config --services | grep -qx "$svc"; then
              echo "  ✓ $svc"
            else
              echo "::error::nginx.conf 反代到 $svc，而 docker-compose 里没有这个服务"
              exit 1
            fi
          done

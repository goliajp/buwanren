name: webadmin

# 后台前端 —— 32 个文件，在这条 workflow 之前**一条门禁都没有**。
# 不是它坏了才加：是它可以坏很久而没人知道，而那正是最贵的那种坏法。
#
# `npm run build` 就是 `tsc -b && vite build`，所以这一步同时管住类型与构建。
# 单独一条 workflow 而不是塞进 backend：那条要 Rust 工具链 + Postgres，
# 改一个 .tsx 不该把它拖起来。

on:
  push:
    branches: [main, develop]
    paths:
      - 'webadmin/**'
      - 'backend/unmei-admin-api/src/routes/**'
      - 'scripts/check-admin-roles.py'
      - 'scripts/admin-role-gaps.json'
      - '.github/workflows/webadmin.yml'
      - 'backend/unmei-admin-api/**'
      - 'scripts/check-routes.py'
      - 'scripts/check-reachable-pages.py'
      - 'scripts/check-bodies.py'
  pull_request:
    paths:
      - 'webadmin/**'
      - 'backend/unmei-admin-api/src/routes/**'
      - 'scripts/check-admin-roles.py'
      - 'scripts/admin-role-gaps.json'
      - '.github/workflows/webadmin.yml'
      - 'backend/unmei-admin-api/**'
      - 'scripts/check-routes.py'
      - 'scripts/check-reachable-pages.py'
      - 'scripts/check-bodies.py'
  workflow_dispatch:

# 同一分支上被后续推送顶掉的 run 没有必要跑完 —— 只有最新那个 commit 的结论有意义。
# 不换任何覆盖，纯粹少烧。（2026-08-23 账户 Actions 因支出上限停摆时加的。）
concurrency:
  group: webadmin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webadmin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webadmin/package-lock.json

      # 后台写操作有没有查角色。见 scripts/admin-role-gaps.json ——
      # 台账不判对错，只判有没有变。
      - name: 后台写操作查角色了吗
        run: python3 scripts/check-admin-roles.py

      - name: install
        run: npm ci --no-audit --no-fund

      # tsc -b && vite build —— 类型与构建一步管完
      - name: build · 类型 + 打包
        run: npm run build

      # 后台的文案也是给人看的，同一条规则
      - name: check-punct-ui · 界面文案的标点全是全角吗
        working-directory: .
        run: python3 scripts/check-punct-ui.py

      # 前端调的每一条接口，后端有没有 —— 不用把它跑起来。
      # 写操作那些接口（取消订单、批退款）连打开页面都不会碰，而它们最要紧。
      # 路由与侧边栏要一一对上。Users 那一页从初始提交起就挂在侧边栏上,
      # 而它要的接口后端根本没有 —— 那件事的另一半由下面 check-routes 管,
      # 这一支管「页面与入口对不对得上」。
      - name: 每一页都走得到吗
        working-directory: .
        run: python3 scripts/check-reachable-pages.py

      - name: check-routes · 调的接口后端都有吗
        working-directory: .
        run: python3 scripts/check-routes.py

      # 路径在、响应结构也没变，只有请求体里的字段名对不上 —— 那是运行期一个 422，
      # 而后台这些写操作是取消订单、拒退款、标记异常这类做一次就有后果的动作。
      - name: check-bodies · 写操作的请求体对得上吗
        working-directory: .
        run: python3 scripts/check-bodies.py

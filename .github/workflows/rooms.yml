name: rooms

on:
  push:
    branches: [main, develop]
    paths: ['rooms/**', '.github/workflows/rooms.yml']
  pull_request:
    paths: ['rooms/**', '.github/workflows/rooms.yml']
  workflow_dispatch:

jobs:
  # ── 门禁 ────────────────────────────────────────────────────────
  # 顺序是有意的:不开浏览器的几支排在前面,坏了几秒钟就知道,
  # 不用等三分钟的 playwright 才看见一个拼写错误。
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rooms

    steps:
      - uses: actions/checkout@v4
        with:
          # compare 要渲染 base 那个版本,得有历史
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install deps
        run: bun install --frozen-lockfile

      # 工具用 chromium.launch({ channel: 'chrome' }) —— 要的是真 Chrome,
      # 不是 playwright 自带的 chromium。装错了会报「找不到 channel chrome」。
      - name: install chrome
        run: bunx playwright install --with-deps chrome

      # design.html 是构建产物。这一步最先跑:源码树与产物不同步的话,
      # 后面所有门禁查的都是一个过时的文件,全绿也没有意义。
      - name: 产物与源码树同步
        run: bun tools/build.js --check --src=src

      - name: hardcodelint · 房间脚本里不许写死坐标
        run: bun tools/hardcodelint.js design.html

      - name: pathlint · 走位不穿模
        run: python3 tools/pathlint.py design.html

      - name: assetlint · 素材元数据 + 逐房布局 + 可达性
        run: bun tools/assetlint.js design.html

      - name: roomaudit · 姿态 / 表演态 / 交互 / 碰撞体积
        run: bun tools/roomaudit.js design.html

      - name: walklint · 角色不滑行
        run: bun tools/walklint.js design.html

      - name: blobscan · 全库 foot vs 实体
        run: bun tools/blobscan.js design.html --gate-only

      # ── 视觉回归:CI 上【不能】用 `check` ────────────────────────
      # 首跑实测:同一份 design.html 在 macOS Chrome 与 Linux Chrome 上
      # 24 个场景全部渲出不同哈希。基准是绑机器的,拿到 CI 一定全红,
      # 而那个红跟房间对不对毫无关系。
      #
      # 所以 CI 换掉判据。基准哈希问的是「像不像那台笔记本」,
      # CI 该问的是「这次改动改变渲染了吗」—— 后者在同一台机器上
      # 比两个版本就行,与平台无关。
      #
      # selfcheck 是硬门禁:渲两遍必须逐帧一致。它查的是渲染的不确定性
      # ——t=0 的画面里混进真实时间、未播种的随机、遍历顺序不稳的容器,
      # 单次渲染完全看不出来,这里一定现形。
      - name: regress selfcheck · 渲染是确定的吗
        run: bun tools/regress.js design.html selfcheck

      # compare 只报不判:改动本来就该改变画面,红灯没有意义。
      # 它的产出是给人看的三图,连同像素数与区域一起上传。
      - name: regress compare · 这次改动改了哪些画面
        if: github.event_name == 'pull_request'
        run: |
          bun tools/regress.js design.html \
            compare --against=${{ github.event.pull_request.base.sha }} --report-only

      - name: 上传画面差异图
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: regress-diff
          path: rooms/.roomwork/baseline/diff/
          if-no-files-found: ignore

      # 数据对表不判失败,但要留在日志里:件数 / 交互覆盖 / 台词量掉下来时
      # 翻历史 run 就能看出是哪一次掉的。
      - name: roomstats · 房间数据对表(仅记录)
        run: python3 tools/roomstats.py design.html
        continue-on-error: true

  # ── 查门禁本身 ──────────────────────────────────────────────────
  # 单独一个 job:它要开十几次浏览器,慢;而且它失败的含义跟上面完全不同 ——
  # 上面红是「房间坏了」,这里红是「门禁坏了,它已经拦不住东西了」。
  # 混在一个 job 里,红灯的意思就说不清。
  meta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rooms

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install deps
        run: bun install --frozen-lockfile

      - name: install chrome
        run: bunx playwright install --with-deps chrome

      - name: mutationtest · 门禁报得出红吗
        working-directory: .
        run: bash rooms/tools/mutationtest.sh
